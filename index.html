<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>爱豆模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Helvetica,Arial,sans-serif;background:#1a1a2e;color:#fff;overflow:hidden;height:100vh;width:100vw;display:flex;justify-content:center;align-items:center}
.phone-frame{width:375px;height:700px;background:#16162a;border-radius:40px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 0 60px rgba(0,0,0,0.8);border:3px solid #2a2a4a}
.status-bar{height:44px;background:#0d0d1f;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:12px;font-weight:600;flex-shrink:0;z-index:10}
.status-left{display:flex;align-items:center;gap:4px;font-size:13px}
.status-right{display:flex;align-items:center;gap:4px}
.signal-bar{width:3px;background:#fff;border-radius:1px;margin:0 1px}
.battery{width:22px;height:10px;border:1.5px solid #fff;border-radius:3px;position:relative;display:flex;align-items:center;justify-content:flex-end;padding:1px}
.battery::after{content:'';position:absolute;right:-4px;top:2px;width:3px;height:5px;background:#fff;border-radius:0 2px 2px 0}
.main-content{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;display:none;padding-bottom:60px}
.main-content.active{display:block}
.home-screen{padding:12px 14px}
.day-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0;margin-bottom:8px;font-size:12px;opacity:0.5}
.day-bar span{font-size:13px;opacity:1}
.player-card{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden}
.player-card::after{content:'';position:absolute;top:-30px;right:-30px;width:100px;height:100px;background:rgba(255,255,255,0.1);border-radius:50%}
.player-card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;flex-shrink:0;overflow:hidden;background:#ccc}
.avatar img{width:100%;height:100%;object-fit:cover}
.player-name{font-size:16px;font-weight:700;margin-bottom:2px}
.player-status-label{font-size:11px;opacity:0.8}
.trainee-badge{display:inline-block;background:rgba(255,255,255,0.2);padding:2px 8px;border-radius:10px;font-size:10px;margin-top:4px}
.debut-badge{display:inline-block;background:#e84393;padding:2px 8px;border-radius:10px;font-size:10px;margin-top:4px;display:none}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-item{background:rgba(0,0,0,0.2);border-radius:10px;padding:7px 8px}
.stat-label{font-size:10px;opacity:0.7;margin-bottom:2px}
.stat-value{font-size:14px;font-weight:700}
.stats-row{display:flex;gap:6px;margin-top:8px;align-items:center}
.money-display{background:rgba(0,0,0,0.2);border-radius:10px;padding:7px 10px;flex:1;display:flex;align-items:center;gap:4px}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.quick-btn{background:#1f1f3a;border-radius:14px;padding:12px 4px;text-align:center;cursor:pointer;transition:all 0.2s;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;color:#fff}
.quick-btn:active{transform:scale(0.95);background:#2a2a50}
.quick-btn .btn-icon{font-size:20px;margin-bottom:1px}
.quick-btn .btn-label{font-size:11px;font-weight:600}
.quick-btn .btn-desc{font-size:9px;opacity:0.5}
.quick-btn.highlight{background:linear-gradient(135deg,#e84393,#fd79a8)}
.countdown-card{background:#1f1f3a;border-radius:14px;padding:12px;margin-bottom:10px;display:none}
.countdown-card.show{display:block}
.countdown-title{font-size:11px;opacity:0.6;margin-bottom:3px}
.countdown-time{font-size:24px;font-weight:700;color:#fd79a8;margin-bottom:4px}
.countdown-progress{width:100%;height:5px;background:#2a2a50;border-radius:3px;overflow:hidden;margin-bottom:4px}
.countdown-progress-bar{height:100%;background:linear-gradient(90deg,#e84393,#fd79a8);border-radius:3px;transition:width 0.5s}
.countdown-sub{font-size:10px;opacity:0.5}
.discover-screen{padding:12px 14px}
.weibo-hot{background:#1f1f3a;border-radius:14px;padding:12px;margin-bottom:10px}
.section-title{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:5px}
.hot-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer}
.hot-item:last-child{border:none}
.hot-rank{font-size:12px;font-weight:700;width:18px;text-align:center;flex-shrink:0}
.hot-rank.top1{color:#ff4757}
.hot-rank.top2{color:#ff6b35}
.hot-rank.top3{color:#ffa502}
.hot-title{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hot-tag{font-size:9px;padding:1px 4px;border-radius:3px;flex-shrink:0}
.tag-hot{background:#ff4757}
.tag-new{background:#2ed573}
.tag-friend{background:#3742fa}
.messages-screen{padding:12px 14px}
.msg-tab-bar{display:flex;gap:8px;margin-bottom:10px}
.msg-tab{padding:6px 14px;background:#1f1f3a;border-radius:20px;font-size:12px;cursor:pointer;border:none;color:#fff;transition:all 0.2s;position:relative}
.msg-tab.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe)}
.msg-badge{position:absolute;top:-4px;right:-4px;background:#ff4757;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center}
.msg-list{background:#1f1f3a;border-radius:14px;overflow:hidden}
.msg-item{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;display:flex;gap:10px;align-items:center}
.msg-item:last-child{border:none}
.msg-item:active{background:rgba(255,255,255,0.05)}
.msg-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:#3a3a5a;overflow:hidden}
.msg-avatar img{width:100%;height:100%;object-fit:cover}
.msg-info{flex:1;min-width:0}
.msg-name{font-size:13px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:4px}
.msg-preview{font-size:11px;opacity:0.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine-screen{padding:12px 14px}
.mine-header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;text-align:center;position:relative;overflow:hidden}
.mine-avatar-wrap{position:relative;display:inline-block;margin-bottom:8px}
.mine-avatar{width:60px;height:60px;border-radius:50%;margin:0 auto 8px;font-size:26px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#ddd}
.mine-avatar img{width:100%;height:100%;object-fit:cover}
.mine-avatar-edit{position:absolute;bottom:0;right:0;width:20px;height:20px;background:#6c5ce7;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid #a29bfe;cursor:pointer}
.mine-name{font-size:16px;font-weight:700;margin-bottom:2px}
.mine-id{font-size:10px;opacity:0.5;margin-bottom:2px}
.mine-status{font-size:11px;margin-bottom:8px;opacity:0.8;display:flex;align-items:center;justify-content:center;gap:4px}
.mine-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.mine-stat{background:rgba(0,0,0,0.15);border-radius:10px;padding:6px 4px;text-align:center}
.mine-stat-value{font-size:14px;font-weight:700}
.mine-stat-label{font-size:9px;opacity:0.7;margin-top:1px}
.menu-card{background:#1f1f3a;border-radius:14px;overflow:hidden;margin-bottom:10px}
.menu-item{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.menu-item:last-child{border:none}
.menu-item:active{background:rgba(255,255,255,0.05)}
.menu-icon{font-size:16px;width:22px;text-align:center}
.menu-arrow{color:#555;font-size:12px;margin-left:auto}
.tab-bar{height:60px;background:#0d0d1f;border-top:1px solid #1a1a2e;display:flex;position:absolute;bottom:0;left:0;right:0;z-index:10}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:none;color:#555;transition:all 0.2s;font-size:10px;padding:0}
.tab-item.active{color:#a29bfe}
.tab-item .tab-icon{font-size:20px;margin-bottom:1px}
.tab-item.center-tab .tab-icon{font-size:26px;color:#a29bfe}
.tab-item .tab-badge{position:relative}
.tab-item .tab-badge::after{content:'';position:absolute;top:-2px;right:-4px;width:8px;height:8px;background:#ff4757;border-radius:50%;display:none}
.tab-item .tab-badge.has-msg::after{display:block}
.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#1a1a2e;width:100%;max-height:85%;border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp 0.3s ease}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;font-size:15px;font-weight:700;border-bottom:1px solid #2a2a4a;flex-shrink:0}
.modal-close{background:none;border:none;color:#888;font-size:20px;cursor:pointer;padding:0}
.modal-body{flex:1;overflow-y:auto;padding:12px 16px}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;opacity:0.6;margin-bottom:5px;display:block}
.form-input{width:100%;background:#2a2a4a;border:1px solid #3a3a5a;border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;outline:none}
.form-input:focus{border-color:#a29bfe}
.form-select{width:100%;background:#2a2a4a;border:1px solid #3a3a5a;border-radius:10px;padding:9px 12px;color:#fff;font-size:13px;outline:none;appearance:none}
.action-btn{width:100%;padding:10px;border-radius:12px;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:all 0.2s}
.action-btn:active{transform:scale(0.97)}
.btn-primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff}
.btn-danger{background:linear-gradient(135deg,#e84393,#fd79a8);color:#fff}
.btn-secondary{background:#2a2a4a;color:#ccc}
.btn-warning{background:linear-gradient(135deg,#e17055,#fdcb6e);color:#fff}
.btn-small{padding:5px 12px;border-radius:8px;border:none;font-size:11px;font-weight:600;cursor:pointer;color:#fff}
.option-list{background:#1f1f3a;border-radius:12px;overflow:hidden;margin-bottom:10px}
.option-item{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.option-item:last-child{border:none}
.option-item:active{background:rgba(255,255,255,0.05)}
.option-name{font-size:13px}
.option-cost{font-size:11px;opacity:0.5;text-align:right}
.option-reward{font-size:11px;color:#2ed573;text-align:right}
.detail-card{background:#2a2a4a;border-radius:12px;padding:12px;margin-bottom:10px}
.detail-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.detail-row span:first-child{opacity:0.6}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.85);color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;z-index:200;display:none;pointer-events:none;white-space:nowrap}
.toast.show{display:block;animation:fadeInOut 1.5s ease forwards}
@keyframes fadeInOut{0%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(0.8)}}
.event-banner{position:absolute;top:44px;left:0;right:0;background:linear-gradient(135deg,#e84393,#fd79a8);padding:9px 14px;font-size:13px;font-weight:600;z-index:50;display:none;animation:slideDown 0.3s ease}
.event-banner.show{display:block}
@keyframes slideDown{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.lock-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:#1a1a2e;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.lock-screen.hide{display:none}
.lock-icon{font-size:46px;margin-bottom:4px}
.lock-title{font-size:18px;font-weight:700}
.lock-sub{font-size:11px;opacity:0.4}
.lock-input-wrap{display:flex;gap:8px;align-items:center}
.lock-input{width:150px;background:#2a2a4a;border:2px solid #3a3a5a;border-radius:10px;padding:9px 12px;color:#fff;font-size:18px;text-align:center;letter-spacing:6px;outline:none}
.lock-input:focus{border-color:#a29bfe}
.lock-btn{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border:none;color:#fff;padding:9px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}
.lock-error{color:#ff4757;font-size:11px;height:14px}
.wx-modal{padding:0!important}
.wx-chat-header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1a1a2e;border-bottom:1px solid #2a2a4a}
.wx-back{background:none;border:none;color:#a29bfe;font-size:22px;cursor:pointer;padding:0;line-height:1}
.wx-contact-name{font-size:14px;font-weight:600;flex:1}
.wx-contact-edit{background:none;border:none;color:#a29bfe;font-size:11px;cursor:pointer;text-decoration:underline}
.wx-messages{flex:1;overflow-y:auto;padding:10px 14px;min-height:280px;max-height:380px;background:#f0f0f5}
.wx-msg{margin-bottom:8px;display:flex;flex-direction:column}
.wx-msg.other{align-items:flex-start}
.wx-msg.self{align-items:flex-end}
.wx-bubble{padding:7px 11px;border-radius:12px;max-width:75%;font-size:13px;line-height:1.5;word-break:break-all}
.wx-msg.other .wx-bubble{background:#fff;color:#333;border-bottom-left-radius:3px}
.wx-msg.self .wx-bubble{background:#6c5ce7;color:#fff;border-bottom-right-radius:3px}
.wx-input-bar{display:flex;gap:6px;padding:8px 12px;border-top:1px solid #2a2a4a;background:#1a1a2e}
.wx-input{flex:1;background:#2a2a4a;border:1px solid #3a3a5a;border-radius:18px;padding:7px 12px;color:#fff;font-size:12px;outline:none}
.wx-send{background:#6c5ce7;border:none;color:#fff;padding:5px 12px;border-radius:18px;font-size:12px;cursor:pointer}
.sms-item{background:#2a2a4a;border-radius:12px;padding:11px;margin-bottom:7px;cursor:pointer}
.sms-item:active{transform:scale(0.98)}
.sms-from{font-size:11px;opacity:0.5;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.sms-from-right{display:flex;align-items:center;gap:5px}
.sms-block-btn{color:#ff4757;font-size:10px;cursor:pointer;text-decoration:underline;background:none;border:none}
.sms-content{font-size:12px;line-height:1.5}
.weibo-card{background:#2a2a4a;border-radius:12px;padding:11px;margin-bottom:7px}
.weibo-text{font-size:13px;line-height:1.5;margin-bottom:6px;word-break:break-all}
.weibo-meta{display:flex;gap:14px;font-size:11px;opacity:0.5;margin-top:4px}
.weibo-like{color:#ff6b6b}
.weibo-editor{background:#2a2a4a;border-radius:12px;padding:12px;margin-bottom:10px}
.weibo-textarea{width:100%;background:transparent;border:none;color:#fff;font-size:13px;resize:none;outline:none;min-height:70px;line-height:1.5}
.char-count{text-align:right;font-size:10px;opacity:0.4;margin-top:4px}
.rel-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.rel-item:last-child{border:none}
.rel-avatar-wrap{position:relative;width:34px;height:34px;border-radius:50%;background:#3a3a5a;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;overflow:hidden}
.rel-avatar-wrap img{width:100%;height:100%;object-fit:cover}
.rel-name{font-size:12px;font-weight:600;flex:1}
.rel-bar-wrap{flex:1;height:4px;background:#2a2a4a;border-radius:2px;overflow:hidden}
.rel-bar{height:100%;background:linear-gradient(90deg,#e84393,#fd79a8);border-radius:2px;transition:width 0.5s}
.rel-val{font-size:10px;color:#fd79a8;width:28px;text-align:right}
.rel-love-btn{font-size:10px;padding:2px 8px;border-radius:8px;background:#e84393;border:none;color:#fff;cursor:pointer;margin-left:4px}
.member-item{background:#2a2a4a;border-radius:12px;padding:10px;margin-bottom:7px;display:flex;align-items:center;gap:8px}
.member-avatar-sm{width:34px;height:34px;border-radius:50%;background:#3a3a5a;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;overflow:hidden}
.member-avatar-sm img{width:100%;height:100%;object-fit:cover}
.member-info{flex:1;min-width:0}
.member-name-sm{font-size:12px;font-weight:600}
.member-role{font-size:10px;opacity:0.5}
.job-card{background:#2a2a4a;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;border:none;width:100%;text-align:left;color:#fff;display:block}
.job-card:active{transform:scale(0.99)}
.job-card-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.job-icon{font-size:22px}
.job-name{font-size:14px;font-weight:700}
.job-req{font-size:11px;opacity:0.5;margin-bottom:4px}
.job-desc{font-size:12px;opacity:0.7;margin-bottom:6px;line-height:1.4}
.job-tags{display:flex;gap:5px;flex-wrap:wrap}
.job-tag{padding:2px 7px;border-radius:8px;font-size:10px;background:rgba(255,255,255,0.1)}
.job-money{color:#fdcb6e;font-weight:700;margin-left:auto}
.save-slot{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer}
.save-slot:active{background:rgba(255,255,255,0.05)}
.save-slot-info{flex:1}
.save-slot-name{font-size:13px;font-weight:600}
.save-slot-date{font-size:10px;opacity:0.5}
.save-slot-btn{font-size:11px;padding:4px 10px;border-radius:8px;border:none;cursor:pointer}
.save-btn-save{background:#6c5ce7;color:#fff}
.save-btn-load{background:#2ed573;color:#fff}
.save-btn-del{background:#ff4757;color:#fff;margin-left:4px}
.avatar-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}
.avatar-opt{width:42px;height:42px;border-radius:50%;background:#2a2a4a;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:3px solid transparent;transition:all 0.2s}
.avatar-opt:hover{border-color:#3a3a5a}
.avatar-opt.selected{border-color:#a29bfe;transform:scale(1.1)}
.color-picker-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.color-picker-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all 0.2s}
.color-picker-swatch:hover{border-color:rgba(255,255,255,0.3)}
.color-picker-swatch.selected{border-color:#fff;transform:scale(1.15)}
.color-picker-custom{margin-top:8px;display:flex;align-items:center;gap:8px}
.color-picker-custom input[type=color]{width:36px;height:36px;border:none;border-radius:50%;cursor:pointer;background:none}
.concert-ready{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-radius:12px;padding:14px;text-align:center;margin-bottom:12px}
.concert-ready-title{font-size:13px;font-weight:700;margin-bottom:4px}
.concert-ready-sub{font-size:11px;opacity:0.7;margin-bottom:10px}
::-webkit-scrollbar{width:0}
</style>
</head>
<body>
<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">🔒</div>
  <div class="lock-title">爱豆模拟器</div>
  <div class="lock-sub" id="lockDate"></div>
  <div class="lock-input-wrap">
    <input class="lock-input" id="lockInput" type="password" maxlength="8" placeholder="●●●●" onkeypress="if(event.key==='Enter')checkLock()">
    <button class="lock-btn" onclick="checkLock()">解锁</button>
  </div>
  <div class="lock-error" id="lockError"></div>
</div>

<div class="phone-frame">
  <div class="status-bar">
    <div class="status-left"><span id="status-time">00:00</span></div>
    <div class="status-right">
      <div class="signal-bar" style="height:8px"></div>
      <div class="signal-bar" style="height:6px"></div>

<script>
// ========== 全局配置 ==========
const GAME_PASSWORD = '0506';
const STAMINA_MAX = 500;
const TRAINEES_MAX_STAMINA = 200;
const INITIAL_MONEY_OPTIONS = [3000, 6000, 8000, 10000];
const SAVE_SLOTS = 3;

const ENTERTAINMENT_COSTS = {outdoor:{stamina:20,money:0,fatigueChange:-15,moodChange:5,skill:null},movie:{stamina:25,money:50,fatigueChange:-20,moodChange:8,skill:null},gym:{stamina:20,money:100,fatigueChange:-10,moodChange:3,skill:'dance'},karaoke:{stamina:30,money:60,fatigueChange:-10,moodChange:6,skill:'vocal'},massage:{stamina:15,money:100,fatigueChange:-30,moodChange:10,skill:null}};

const AVATAR_EMOJIS = ['🙎‍♂️','🙍‍♀️','🧑‍🎤','👨‍🎤','👩‍🎤','🎤','🌟','🔥','💎','🎵','💜','🖤','🤍','💖','🩷','🩵','💛','🧡','💚','🩵','🩶','🤎','🧡','💜','🩷','💙','💛'];

const STYLE_OPTIONS = ['全能偶像','唱跳歌手','实力演员','综艺达人','创作才子','舞台王者','清新治愈','冷酷 rapper'];

// ========== 默认游戏数据 ==========
function makeDefaultState(initialMoney) {
  return {
    playerName:'练习生', gender:'男', style:'全能偶像', sexuality:'保密',
    relationship:'单身', supportColor:'#fd79a8', avatarData:null,
    debuted:false, vocal:10, dance:10, stamina:200, fans:0, mood:80, fatigue:0,
    money: initialMoney || 3000,
    day:1, assessmentCountdown:30,
    concertPlanned:false, concertDaysLeft:0, concertSongLevel:0, concertDanceLevel:0, concertCooldown:0,
    hotWeibo:false, hotWeiboDays:0, banActive:true,
    playerId:Math.floor(Math.random()*9000)+1000,
    teamName:'', solo:true, members:[],
    weibos:[], news:[], pmList:[], pmUnread:0,
    smsList:[], smsUnread:0, smsBlocked:[],
    wxContacts:[
      {id:'manager',name:'经纪人王姐',avatar:'👩‍💼',avatarData:null,lastMsg:'最近状态不错，有几个通告想跟你聊聊',lastMsgTime:0,msgCount:0},
      {id:'assistant',name:'小助理阿涛',avatar:'🧑‍💻',avatarData:null,lastMsg:'明天的行程我安排好了',lastMsgTime:0,msgCount:0},
      {id:'senior',name:'前辈周哥',avatar:'👨‍🎤',avatarData:null,lastMsg:'加油弟弟，期待你出道',lastMsgTime:0,msgCount:0},
      {id:'mom',name:'妈妈',avatar:'👩',avatarData:null,lastMsg:'宝贝注意身体呀',lastMsgTime:0,msgCount:0,hidden:true},
    ],
    wxMessages:{
      manager:[{from:'other',text:'最近状态不错，有几个通告想跟你聊聊'}],
      assistant:[{from:'other',text:'明天的行程我安排好了'}],
      senior:[{from:'other',text:'加油弟弟，期待你出道'}],
      mom:[{from:'other',text:'宝贝注意身体呀'}],
    },
    relationships:[
      {id:'manager',name:'经纪人王姐',role:'经纪人',value:50,avatar:'👩‍💼',avatarData:null,canEdit:true,canDate:true},
      {id:'assistant',name:'小助理阿涛',role:'助理',value:45,avatar:'🧑‍💻',avatarData:null,canEdit:true,canDate:true},
      {id:'senior',name:'前辈周哥',role:'前辈',value:40,avatar:'👨‍🎤',avatarData:null,canEdit:false,canDate:true},
      {id:'mom',name:'妈妈',role:'家人',value:70,avatar:'👩',avatarData:null,canEdit:false,canDate:false},
    ],
    newContacts:[],
  };
}

let game = makeDefaultState(3000);
let wxActiveContact = null;
let _editAvatarData = null;

// ========== 存档系统 ==========
function getSaveSlots() {
  const slots = [];
  for (let i = 0; i < SAVE_SLOTS; i++) {
    const data = localStorage.getItem('idolSave' + i);
    if (data) {
      try {
        const parsed = JSON.parse(data);
        slots.push({index:i, name:parsed._slotName||('存档 '+(i+1)), day:parsed.day||1, date:parsed._saveDate||'', data:parsed});
      } catch(e) { slots.push({index:i, name:'空存档', day:0, date:'', data:null}); }
    } else { slots.push({index:i, name:'空存档', day:0, date:'', data:null}); }
  }
  return slots;
}
function saveToSlot(idx) {
  game._slotName = '存档 ' + (idx+1);
  game._saveDate = new Date().toLocaleString('zh-CN');
  localStorage.setItem('idolSave'+idx, JSON.stringify(game));
  toast('存档成功！');
  closeModal();
}
function loadFromSlot(idx) {
  const data = localStorage.getItem('idolSave'+idx);
  if (!data) { toast('存档为空'); return; }
  try {
    game = JSON.parse(data);
    updateUI(); renderHotList(); renderPMList(); renderWXList(); renderSMSList(); renderMyWeibos(); checkConcert();
    toast('读档成功！');
    closeModal();
  } catch(e) { toast('读档失败'); }
}
function deleteSlot(idx) {
  localStorage.removeItem('idolSave'+idx);
  toast('已删除存档');
  closeModal();
  showSaveLoad();
}
function showSaveLoad() {
  const slots = getSaveSlots();
  const html = slots.map((s,i) => `<div class="save-slot">
    <div class="save-slot-info">
      <div class="save-slot-name">${s.name} ${s.day>0?'— 第'+s.day+'天':''}</div>
      ${s.date ? '<div class="save-slot-date">'+s.date+'</div>' : ''}
    </div>
    ${s.data ? '<button class="save-btn-save save-btn-load" onclick="loadFromSlot('+i+')">读档</button><button class="save-btn-save save-btn-del" onclick="deleteSlot('+i+')">删除</button>' : '<button class="save-btn-save" onclick="saveToSlot('+i+')">存档</button>'}
  </div>`).join('');
  showModal('💾 存档/读档', html);
}

// ========== 初始化 ==========
function loadGame() {
  const saved = localStorage.getItem('idolCurrent');
  if (saved) { try { game = JSON.parse(saved); } catch(e){} }
}
function saveGame() { localStorage.setItem('idolCurrent', JSON.stringify(game)); }
function init() {
  loadGame();
  updateStatusBar();
  updateUI();
  renderHotList();
  renderPMList();
  renderWXList();
  renderSMSList();
  renderMyWeibos();
  checkConcert();
  setInterval(updateStatusBar, 1000);
  setInterval(gameTick, 60000);
  setInterval(maybeGenerateEvent, 30000);
}

// ========== 游戏循环 ==========
function gameTick() {
  // 每天恢复体力（只在睡觉时增加天数）
  const maxSt = game.debuted ? STAMINA_MAX : TRAINEES_MAX_STAMINA;
  if (game.stamina < maxSt) game.stamina = Math.min(maxSt, game.stamina + 100);
  game.assessmentCountdown--;
  if (game.assessmentCountdown <= 0 && !game.debuted) triggerAssessment();
  if (game.fatigue > 0) game.fatigue = Math.max(0, game.fatigue - 1);
  if (game.mood < 80) game.mood = Math.min(80, game.mood + 1);
  if (game.hotWeibo && game.hotWeiboDays > 0) { game.hotWeiboDays--; if (game.hotWeiboDays <= 0) game.hotWeibo = false; }
  if (game.concertCooldown > 0) game.concertCooldown--;
  // 微信未读时间追踪
  game.wxContacts.forEach(c => { if (c.msgCount > 0) c.lastMsgTime++; });
  // 偷着恋爱被抓
  if (game.debuted && game.relationship === '恋爱中' && game.banActive) {
    if (Math.random() < 0.05) { triggerScandal(); }
  }
  updateUI(); saveGame();
}
function maybeGenerateEvent() {
  if (Math.random() < 0.15) generateRandomEvent();
  if (Math.random() < 0.2) generateRandomPM();
  if (Math.random() < 0.15) generateRandomSMS();
  renderPMList(); renderSMSList(); renderWXList();
  updateBadges();
}

// ========== 塌房 ==========
function triggerScandal() {
  eventBanner('🚨 塌房事件！');
  toast('🚨 恋爱曝光！公司震怒！');
  game.fans = Math.max(0, Math.floor(game.fans * 0.5));
  game.mood = Math.max(0, game.mood - 40);
  game.fatigue = Math.min(100, game.fatigue + 40);
  addLog('🚨 恋爱曝光！粉丝数腰斩！');
  // 生成大量黑粉私信
  for (let i = 0; i < 5; i++) generateRandomPM();
  renderHotList();
}

// ========== 状态栏 ==========
function updateStatusBar() {
  const now = new Date();
  document.getElementById('status-time').textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const maxSt = game.debuted ? STAMINA_MAX : TRAINEES_MAX_STAMINA;
  const bat = Math.min(game.stamina / maxSt, 1) * 100;
  document.getElementById('battery-bar').innerHTML = `<span style="width:${bat}%;height:100%;background:${bat>30?'#2ed573':'#ff4757'};border-radius:2px;display:block"></span>`;
}

// ========== UI更新 ==========
function updateUI() {
  const maxSt = game.debuted ? STAMINA_MAX : TRAINEES_MAX_STAMINA;
  document.getElementById('dayDisplay').textContent = game.day;
  document.getElementById('playerName').textContent = game.playerName;
  document.getElementById('playerId').textContent = game.playerId;
  if (game.avatarData) {
    document.getElementById('playerAvatar').innerHTML = `<img src="${game.avatarData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    document.getElementById('playerAvatar').style.background = 'none';
  }
  document.getElementById('stat-vocal').textContent = game.vocal;
  document.getElementById('stat-dance').textContent = game.dance;
  document.getElementById('stat-stamina').textContent = `${game.stamina}/${maxSt}`;
  document.getElementById('stat-fans').textContent = game.debuted ? formatNum(game.fans) : '—';
  document.getElementById('stat-mood').textContent = game.mood;
  document.getElementById('stat-fatigue').textContent = game.fatigue;
  document.getElementById('stat-money').textContent = formatNum(game.money);

  if (game.avatarData) {
    document.getElementById('mineAvatar').innerHTML = `<img src="${game.avatarData}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    document.getElementById('mineAvatar').style.background = 'none';
  } else {
    document.getElementById('mineAvatar').innerHTML = '🎤';
    document.getElementById('mineAvatar').style.background = `linear-gradient(135deg,${game.supportColor},${game.supportColor}88)`;
  }
  document.getElementById('mineName').textContent = game.playerName;
  document.getElementById('mineId').textContent = game.playerId;
  document.getElementById('mine-fans').textContent = game.debuted ? formatNum(game.fans) : '—';
  document.getElementById('mine-vocal').textContent = game.vocal;
  document.getElementById('mine-dance').textContent = game.dance;
  document.getElementById('mine-money').textContent = formatNum(game.money);

  let statusText = '';
  if (game.debuted) {
    if (game.banActive) statusText = '🚫 限制恋爱令';
    else if (game.relationship === '恋爱中') statusText = '💕 恋爱中（秘密）';
    else if (game.relationship === '已婚') statusText = '💍 隐婚';
    else statusText = '💔 单身';
  }
  document.getElementById('mineStatusLabel').textContent = statusText;

  if (game.debuted) {
    document.getElementById('badge-trainee').style.display = 'none';
    document.getElementById('badge-debut').style.display = 'inline-block';
    document.getElementById('btn-jobs').style.opacity = '1'; document.getElementById('btn-jobs-desc').textContent = '可接通告';
    document.getElementById('btn-assess').style.opacity = '0.4'; document.getElementById('btn-assess-desc').textContent = '已出道';
    document.getElementById('btn-concert-desc').textContent = game.fans >= 100000 ? (game.concertCooldown>0?`${game.concertCooldown}天后可开`:`可开演唱会`) : '需10万粉丝';
    document.getElementById('btn-concert').style.opacity = game.fans >= 100000 && game.concertCooldown===0 ? '1' : '0.4';
    document.getElementById('menu-ban').style.display = 'flex';
    document.getElementById('menu-live').style.display = 'flex';
    document.getElementById('menu-teamname').style.display = game.solo ? 'none' : 'flex';
    document.getElementById('menu-team').style.display = game.solo ? 'none' : 'flex';
  } else {
    document.getElementById('badge-trainee').style.display = 'inline-block';
    document.getElementById('badge-debut').style.display = 'none';

  }

  const smsUnblocked = game.smsList.filter(s => !game.smsBlocked.includes(s.from));
  if (game.smsUnread > 0) {
    document.getElementById('smsBadge').style.display = 'inline';
    document.getElementById('smsBadge').textContent = game.smsUnread;
  } else {
    document.getElementById('smsBadge').style.display = 'none';

  const wxUnread = game.wxContacts.filter(c => !c.hidden && c.msgCount > 0).length;

  } else {
    document.getElementById('wxBadge').style.display = 'none';
    document.getElementById('tab-badge-msg').classList.remove('has-msg');

}

function formatNum(n) {
  if (n >= 100000000) return (n/100000000).toFixed(1)+'亿';
  if (n >= 10000) return (n/10000).toFixed(1)+'万';
  return n.toLocaleString();
}

function doJob(idx) {
  const jobs = getAvailableJobs();
  const job = jobs[idx];

  const staminaCost = rand(job.staminaMin, job.staminaMax);

  if (game.money < Math.floor(job.money * 0.1)) { toast('需要预付费用！'); return; }
  game.stamina -= staminaCost;
  game.money -= Math.floor(job.money * 0.1);
  const fanGain = rand(job.fanMin > 0 ? 50000 : 10000, job.fanMin > 0 ? 100000 : 50000);
  game.fans += fanGain;
  game.money += job.money;
  game.fatigue += 20;
  game.mood = Math.min(100, game.mood + 10);
  addLog('完成通告「' + job.name + '」！粉丝+' + formatNum(fanGain) + '，金币+' + formatNum(job.money));

  updateUI(); saveGame(); closeModal();

function doEntertainment(id) {
  const e = ENTERTAINMENT_COSTS[id];
  if (!e) return;
  if (game.stamina < e.stamina) { toast('体力不足！'); return; }
  if (game.money < e.money) { toast('金币不足！'); return; }
  game.stamina -= e.stamina;
  game.money -= e.money;
  if (e.fatigueChange < 0) game.fatigue = Math.max(0, game.fatigue + e.fatigueChange);
  if (e.fatigueChange > 0) game.fatigue = Math.min(100, game.fatigue + e.fatigueChange);
  game.mood = Math.min(100, game.mood + e.moodChange);
  if (e.skill) game[e.skill] += {dance:3, vocal:2}[e.skill] || 0;
  addLog('去' + {outdoor:'户外放松',movie:'看了电影',gym:'健身房',karaoke:'唱KTV',massage:'按摩'}[id] + '，感觉很好');
  toast('放松完毕！');
  if (id === 'outdoor' || id === 'movie') {
    if (Math.random() < 0.1) {

        eventBanner('🚨 紧急公关事件！');

      } else {
        addLog('出门玩得很开心！');

  updateUI(); saveGame(); closeModal();

function triggerCrisis() {
  const crises = [
    {title:'被拍到私下行程',desc:'有媒体拍到你的私人行程，引发猜测',effect:()=>{ game.fans=Math.max(0,game.fans-rand(5000,20000)); game.mood-=20;}},
    {title:'绯闻八卦',desc:'网上流传你与异性的合照引发猜测',effect:()=>{ game.mood-=30;}},
    {title:'言论风波',desc:'一段视频引发网友争议',effect:()=>{ game.mood-=25; game.fans=Math.max(0,game.fans-rand(3000,8000));}},
  ];
  const c = crises[rand(0, crises.length-1)];
  c.effect();
  toast('🚨 '+c.title);
  setTimeout(()=>showModal('🚨 紧急公关',`<div style="text-align:center;padding:8px">
    <div style="font-size:40px;margin-bottom:8px">🚨</div>
    <div style="font-size:15px;font-weight:700;margin-bottom:6px">${c.title}</div>
    <div style="font-size:12px;opacity:0.7;margin-bottom:14px">${c.desc}</div>
    <button class="action-btn btn-primary" onclick="handleCrisis('public')">📢 发声明澄清</button>
    <button class="action-btn btn-secondary" onclick="handleCrisis('silent')">🤐 沉默应对</button>
    <button class="action-btn btn-warning" onclick="handleCrisis('compensation')">💰 出钱平息</button>
  </div>`),300);
}
function handleCrisis(way) {
  if (way==='public') { game.mood=Math.min(100,game.mood+5); game.fans+=rand(500,2000); toast('声明发出，大部分粉丝支持你'); }
  else if (way==='silent') { game.fans=Math.max(0,game.fans-rand(3000,10000)); toast('沉默应对，舆论发酵...'); }
  else { game.money-=2000; toast('花钱平息了事态，金币-2000'); }
  updateUI(); saveGame(); closeModal();
}

      </div>

      <button class="action-btn btn-primary" onclick="practiceConcert('dance')">💃 练习舞蹈</button>
      <div style="font-size:10px;opacity:0.5;margin-top:6px">每次消耗20体力，增加15%熟练度，消耗1天</div>
    </div>
  `);
}
function practiceConcert(type) {
  if (!game.concertPlanned) return;
  if (game.stamina < 20) { toast('体力不足！'); return; }
  if (game.concertDaysLeft <= 0) { executeConcert(); return; }
  game.stamina -= 20;
  game.fatigue = Math.min(100, game.fatigue + 5);
  game.day++;
  game.concertDaysLeft = Math.max(0, game.concertDaysLeft - 1);
  if (type==='song') game.concertSongLevel = Math.min(100, game.concertSongLevel+15);
  else game.concertDanceLevel = Math.min(100, game.concertDanceLevel+15);
  toast((type==='song'?'歌曲':'舞蹈')+'熟练度+15%');
  addLog('演唱会排练：'+(type==='song'?'🎵':'💃')+'+15%');
  if (game.concertDaysLeft <= 0) { executeConcert(); return; }
  updateUI(); saveGame(); showConcertStatus();
}
function executeConcert() {
  game.concertPlanned = false;
  game.concertCooldown = 30;
  const avg = Math.round((game.concertSongLevel+game.concertDanceLevel)/2);
  if (avg >= 80) {
    const fanGain = rand(50000, 150000);
    game.fans += fanGain;
    game.money += 20000;
    game.mood = Math.min(100, game.mood+50);
    game.fatigue = Math.min(100, game.fatigue+30);
    addLog('🎤 演唱会大成功！粉丝+'+formatNum(fanGain)+'，金币+20000');
    toast('🎉 演唱会圆满成功！粉丝+'+formatNum(fanGain));
    if (Math.random() < 0.5) { game.hotWeibo=true; game.hotWeiboDays=5; game.fans+=rand(30000,80000); eventBanner('🔥 演唱会冲上热搜！'); renderHotList(); }
  } else {
    const fanLoss = rand(5000, 20000);
    game.fans = Math.max(0, game.fans-fanLoss);
    game.money = Math.max(0, game.money-5000);
    game.mood = Math.max(0, game.mood-20);
    game.fatigue = Math.min(100, game.fatigue+30);
    addLog('😢 演唱会表现不佳，粉丝-'+formatNum(fanLoss));
    toast('😢 演唱会未达标，粉丝-'+formatNum(fanLoss));
  }
  updateUI(); saveGame(); closeModal();
}
function checkConcert() {
  const card = document.getElementById('countdownCard');
  if (game.concertPlanned) {
    card.classList.add('show');
    const avg = Math.round((game.concertSongLevel+game.concertDanceLevel)/2);

function debut() {

function renderPMList() {
  if (game.pmList.length === 0) { document.getElementById('pmList').innerHTML = '<div style="text-align:center;padding:20px;opacity:0.4;font-size:13px">暂无私信</div>'; return; }

    <span style="font-size:10px;opacity:0.4">${p.time}</span>
  </div>`).join('');

function showPM(id) {
  const pm = game.pmList.find(p=>p.id===id);
  if (!pm) return;
  game.pmUnread = Math.max(0, game.pmUnread-1);
  let options = '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">';
  if (pm.type==='fan') {
    options += '<button class="btn-small" style="background:#6c5ce7" onclick="replyPM('+id+',\'thanks\')">😊 感谢</button>';
    options += '<button class="btn-small" style="background:#e84393" onclick="replyPM('+id+',\'love\')">💕 爱你</button>';
  } else if (pm.type==='sasa') {
    options += '<button class="btn-small" style="background:#ff6b35" onclick="replyPM('+id+',\'warn\')">⚠️ 警告</button>';
    options += '<button class="btn-small" style="background:#555" onclick="replyPM('+id+',\'block\')">🚫 拉黑</button>';
  } else {
    options += '<button class="btn-small" style="background:#555" onclick="ignorePM('+id+')">🤐 无视</button>';
    options += '<button class="btn-small" style="background:#e17055" onclick="replyPM('+id+',\'fight\')">💪 回应</button>';
  }
  options += '</div>';
  showModal(pm.name, `<div style="padding:4px">
    <div style="font-size:40px;margin-bottom:8px;text-align:center">${pm.avatar}</div>
    <div style="font-size:14px;opacity:0.8;margin-bottom:12px;line-height:1.5">${pm.content}</div>
    ${options}
  </div>`);
  updateBadges();
}
function replyPM(id, type) {
  const pm = game.pmList.find(p=>p.id===id);
  if (!pm) return;
  if (type==='thanks') { game.mood=Math.min(100,game.mood+3); toast('收到暖心支持！'); }
  else if (type==='love') { game.mood=Math.min(100,game.mood+5); if(game.debuted) game.fans+=rand(100,500); toast('粉丝激动坏了！'); }
  else if (type==='warn') { toast('已警告对方'); if(Math.random()<0.3){ eventBanner('⚠️ 私生发飙！'); game.mood-=5; }}
  else if (type==='block') { toast('已拉黑'); }
  else if (type==='fight') {
    if(Math.random()<0.5){ game.mood-=15; if(game.debuted) game.fans=Math.max(0,game.fans-rand(1000,3000)); toast('引发争议...'); addLog('回应黑粉，舆论分化'); }
    else { game.mood+=10; if(game.debuted) game.fans+=rand(500,2000); toast('大部分人站你这边！'); }
  }
  game.pmList = game.pmList.filter(p=>p.id!==id);
  updateUI(); saveGame(); renderPMList(); closeModal();
}
function ignorePM(id) {
  game.pmList = game.pmList.filter(p=>p.id!==id);
  game.pmUnread = Math.max(0, game.pmUnread-1);
  updateUI(); saveGame(); renderPMList(); closeModal();
}

function openWXChat(contactId) {
  wxActiveContact = contactId;
  const contact = game.wxContacts.find(c=>c.id===contactId);
  if (!contact) return;
  contact.msgCount = 0;
  updateBadges(); saveGame();
  const msgs = game.wxMessages[contact.name]||[];
  renderWXChatBody(contact, msgs);
}
function renderWXChatBody(contact, msgs) {
  const canEdit = game.relationships.find(r=>r.id===contactId&&r.canEdit);
  const rel = game.relationships.find(r=>r.id===contactId);
  const bodyHtml = `<div class="wx-chat-header">
    <button class="wx-back" onclick="openWXChat('${contact.id}')">‹</button>
    <span class="wx-contact-name">${contact.name}</span>
    ${canEdit||rel?'<button class="wx-contact-edit" onclick="showContactProfile(\''+contact.id+'\')">✏️</button>':''}
  </div>
  <div class="wx-messages" id="wxMsgArea">${msgs.map(m=>`<div class="wx-msg ${m.from}"><div class="wx-bubble">${m.text}</div></div>`).join('')}</div>
  <div class="wx-input-bar">
    <input class="wx-input" id="wxInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendWXMsg('${contact.id}')">
    <button class="wx-send" onclick="sendWXMsg('${contact.id}')">发送</button>
  </div>`;
  document.getElementById('modalTitle').textContent = contact.name;
  document.getElementById('modalBody').innerHTML = bodyHtml;
  document.getElementById('modalBody').className = 'modal-body wx-modal';
  document.getElementById('modalOverlay').classList.add('show');
  setTimeout(()=>{ const area=document.getElementById('wxMsgArea'); if(area) area.scrollTop=area.scrollHeight; }, 100);
}
function sendWXMsg(contactId) {
  const input = document.getElementById('wxInput');
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  const contact = game.wxContacts.find(c=>c.id===contactId);
  if (!contact) return;
  if (!game.wxMessages[contact.name]) game.wxMessages[contact.name] = [];
  game.wxMessages[contact.name].push({from:'self', text});
  contact.lastMsg = text;
  contact.msgCount = 0;
  // 增加好感度
  const rel = game.relationships.find(r=>r.id===contactId);
  if (rel) { rel.value = Math.min(100, rel.value + 1); }
  // 经纪人特殊处理
  if (contactId === 'manager') rel.value = Math.min(100, rel.value + 1);
  // NPC回复（随机延迟）
  const replies = getNPCReplies(contactId);
  setTimeout(()=>{
    if (replies.length) {
      const rep = replies[rand(0, replies.length-1)];
      game.wxMessages[contact.name].push({from:'other', text:rep});
      contact.lastMsg = rep;
      contact.lastMsgTime = 0;
      contact.msgCount = 1;
      renderWXChatMessages(contactId);
      updateBadges(); saveGame();
    }
  }, 1500+Math.random()*2500);
  renderWXChatMessages(contactId);
  input.value = '';
  saveGame(); renderWXList();
}
function getNPCReplies(contactId) {
  const r = {
    manager:['好的收到，我安排一下','知道了，最近行程比较满','嗯，辛苦了','没问题，我来处理','你最近表现很好，继续保持！'],
    assistant:['明白！我马上去办','收到，王姐交代过了','好的好的','我这就去做！'],
    senior:['加油！','好好努力，期待你','年轻人有冲劲','有空来我录音棚坐坐'],
    mom:['宝贝记得按时吃饭','妈妈给你寄了点营养品','照顾好自己','要努力但也要注意身体哦'],
  };
  if (contactId.startsWith('new_')) return ['你好！', '很高兴认识你', '期待以后合作', '有缘再见！'];
  return r[contactId] || ['收到'];
}
function renderWXChatMessages(contactId) {
  const contact = game.wxContacts.find(c=>c.id===contactId);
  if (!contact) return;
  const msgs = game.wxMessages[contact.name]||[];
  const area = document.getElementById('wxMsgArea');
  if (area) { area.innerHTML = msgs.map(m=>`<div class="wx-msg ${m.from}"><div class="wx-bubble">${m.text}</div></div>`).join(''); area.scrollTop = area.scrollHeight; }
}

  toast('已回复：别再骚扰我，否则报警');
  if (Math.random()<0.3) { eventBanner('⚠️ 私生收到警告后发飙！'); game.mood-=5; }
  updateUI(); saveGame(); closeModal();
}

// ========== 我的页面 ==========
function handleAvatarUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = e.target.result;
    game.avatarData = data;
    saveGame();
    updateUI();
    toast('头像已更新！');
  };
  reader.readAsDataURL(file);
}

function showEditProfile() {
  const avatarOpts = AVATAR_EMOJIS.map(a => `<div class="avatar-opt ${!game.avatarData&&game.playerName!=='未设置'&&game.playerName.includes(a)?'selected':''}" onclick="selectAvatarEmoji('${a}',this)">${a}</div>`).join('');
  const styleOpts = STYLE_OPTIONS.map(s => `<option value="${s}" ${game.style===s?'selected':''}>${s}</option>`).join('');
  let relOptions = `<option value="单身" ${game.relationship==='单身'?'selected':''}>单身</option>`;
  if (game.debuted) {
    relOptions += `<option value="恋爱中" ${game.relationship==='恋爱中'?'selected':''}>💕 恋爱中（秘密）</option>`;
    relOptions += `<option value="已婚" ${game.relationship==='已婚'?'selected':''}>💍 隐婚</option>`;
  }
  const colorPicker = `<div class="color-picker-custom">
    <input type="color" id="colorPicker" value="${game.supportColor}" onchange="previewColor(this.value)">
    <span style="font-size:11px;opacity:0.6">自定义颜色</span>
  </div>`;
  showModal('编辑资料', `
    <div class="form-group">
      <label class="form-label">头像</label>
      <div style="font-size:11px;opacity:0.5;margin-bottom:4px">点击右上角从相册选择，或选一个emoji</div>
      <div class="avatar-grid">${avatarOpts}</div>
    </div>
    <div class="form-group"><label class="form-label">昵称</label><input class="form-input" id="edit-name" value="${game.playerName}" maxlength="12"></div>
    <div class="form-group"><label class="form-label">性别</label><select class="form-select" id="edit-gender"><option value="男" ${game.gender==='男'?'selected':''}>男</option><option value="女" ${game.gender==='女'?'selected':''}>女</option></select></div>
    <div class="form-group"><label class="form-label">风格定位</label><select class="form-select" id="edit-style">${styleOpts}</select></div>
    <div class="form-group"><label class="form-label">应援色</label><div class="color-picker-wrap" id="colorWrap"></div>${colorPicker}</div>
    <div class="form-group"><label class="form-label">恋爱状况</label><select class="form-select" id="edit-rel">${relOptions}</select></div>
    <button class="action-btn btn-primary" onclick="saveProfile()">保存</button>
  `);
  renderColorPicker();
}
function renderColorPicker() {
  const colors = ['#fd79a8','#e84393','#a29bfe','#6c5ce7','#2ed573','#fdcb6e','#e17055','#74b9ff','#ff6b6b','#55efc4','#00cec9','#fab1a0','#fd79a8','#e17055','#0984e3','#6c5ce7','#00b894','#fdcb6e','#e84393','#a29bfe'];
  const html = colors.map(c => `<div class="color-picker-swatch ${game.supportColor===c?'selected':''}" style="background:${c}" onclick="selectColorSwatch('${c}',this)"></div>`).join('');
  document.getElementById('colorWrap').innerHTML = html;
}
function selectColorSwatch(color, el) {
  document.querySelectorAll('.color-picker-swatch').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('colorPicker').value = color;
  window._editColor = color;
}
function previewColor(color) {
  window._editColor = color;
  document.querySelectorAll('.color-picker-swatch').forEach(x=>x.classList.remove('selected'));
}
function selectAvatarEmoji(emoji, el) {
  document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  window._editAvatar = emoji;
}
function saveProfile() {
  game.playerName = document.getElementById('edit-name').value.trim() || '练习生';
  game.gender = document.getElementById('edit-gender').value;
  game.style = document.getElementById('edit-style').value;
  game.relationship = document.getElementById('edit-rel').value;
  if (window._editAvatar) { game.avatarData = null; game.playerName = window._editAvatar + ' ' + (document.getElementById('edit-name').value.trim()||'练习生'); }
  if (window._editColor) game.supportColor = window._editColor;
  if (game.debuted && game.relationship!=='单身' && game.banActive) toast('⚠️ 限制令期间！小心被曝光！');
  saveGame(); updateUI(); closeModal(); toast('资料已保存');
}

function showContactProfile(contactId) {
  const contact = game.wxContacts.find(c=>c.id===contactId);
  const rel = game.relationships.find(r=>r.id===contactId);
  if (!contact) return;
  const avatarOpts = AVATAR_EMOJIS.map(a => `<div class="avatar-opt ${contact.avatar===a?'selected':''}" onclick="setContactAvatar('${contactId}','${a}',this)">${a}</div>`).join('');
  showModal(contact.name + ' — 编辑资料', `
    <div class="form-group"><label class="form-label">头像</label><div class="avatar-grid">${avatarOpts}</div></div>
    <div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="c-name" value="${contact.name}"></div>
    ${rel&&rel.canEdit?'<div class="form-group"><label class="form-label">性别</label><select class="form-select" id="c-gender"><option value="男">男</option><option value="女">女</option></select></div>':''}
    ${rel&&rel.canDate&&rel.value>=100?'<div style="background:#e84393;border-radius:12px;padding:14px;margin-bottom:10px;text-align:center"><div style="font-size:13px;font-weight:700;margin-bottom:8px">好感度达到100！</div><button class="btn-small" style="background:#fff;color:#e84393;margin:2px" onclick="confessTo(\''+contactId+'\')">💕 告白</button><button class="btn-small" style="background:rgba(255,255,255,0.2);color:#fff;margin:2px" onclick="befriend(\''+contactId+'\')">🤝 做朋友</button></div>':''}
    <div class="form-group"><label class="form-label">好感度</label><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:6px;background:#2a2a4a;border-radius:3px;overflow:hidden"><div style="height:6px;width:${rel?rel.value:0}%;background:linear-gradient(90deg,#e84393,#fd79a8)"></div></div><span style="font-size:12px;color:#fd79a8">${rel?rel.value:0}</span></div></div>
    <button class="action-btn btn-primary" onclick="saveContactProfile('${contactId}')">保存</button>
  `);
}
function setContactAvatar(contactId, emoji, el) {
  document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  window._contactAvatar = emoji;
}
function saveContactProfile(contactId) {
  const contact = game.wxContacts.find(c=>c.id===contactId);
  if (!contact) return;
  if (window._contactAvatar) { contact.avatar = window._contactAvatar; contact.avatarData = null; }
  const newName = document.getElementById('c-name').value.trim();
  if (newName) {
    const oldName = contact.name;
    contact.name = newName;
    // 迁移消息记录
    if (game.wxMessages[oldName]) { game.wxMessages[newName] = game.wxMessages[oldName]; delete game.wxMessages[oldName]; }
  }
  const rel = game.relationships.find(r=>r.id===contactId);
  if (rel) rel.name = contact.name;
  saveGame(); updateUI(); renderWXList(); closeModal(); toast('保存成功');
}
function confessTo(contactId) {
  const contact = game.wxContacts.find(c=>c.id===contactId);
  const rel = game.relationships.find(r=>r.id===contactId);
  if (!contact||!rel) return;
  if (game.banActive) {
    toast('⚠️ 限制令期间！偷偷恋爱有风险！');
  }
  if (Math.random() < 0.7) {
    game.relationship = '恋爱中';
    addLog('💕 和' + contact.name + '在一起了！（秘密恋爱中）');
    toast('💕 告白成功！祝幸福！');
    rel.value = 100;
    // 发微信消息
    if (!game.wxMessages[contact.name]) game.wxMessages[contact.name] = [];
    game.wxMessages[contact.name].push({from:'other', text:'我也喜欢你！我们秘密在一起吧 ❤️'});
    contact.lastMsg = '我也喜欢你！我们秘密在一起吧 ❤️';
    contact.msgCount = 1;
    eventBanner('💕 恋爱关系确立！');
  } else {
    toast('😢 ' + contact.name + '婉拒了你...');
    rel.value = Math.max(20, rel.value - 20);
  }
  updateUI(); saveGame(); closeModal();
}
function befriend(contactId) {
  toast('你们决定做一辈子的好朋友！');
  const rel = game.relationships.find(r=>r.id===contactId);
  if (rel) rel.value = Math.min(100, rel.value + 10);
  updateUI(); saveGame(); closeModal();
}

function showRelationships() {
  const html = game.relationships.map(r => {
    const contact = game.wxContacts.find(c=>c.id===r.id);
    const canDate = r.canDate && r.value >= 100;
    return `<div class="rel-item">
      <div class="rel-avatar-wrap">${r.avatarData?'<img src="'+r.avatarData+'" style="width:100%;height:100%;object-fit:cover">':r.avatar}</div>
      <div class="rel-name">${r.name} <span style="font-size:10px;opacity:0.4">(${r.role})</span></div>
      <div class="rel-bar-wrap"><div class="rel-bar" style="width:${r.value}%"></div></div>
      <div class="rel-val">${r.value}</div>
      ${canDate&&game.relationship==='单身'?'<button class="rel-love-btn" onclick="confessTo(\''+r.id+'\')">💕</button>':''}
    </div>`;
  }).join('');
  showModal('💕 好感关系', `<div class="detail-card" style="margin-bottom:8px">${html}</div>
    <div style="font-size:10px;opacity:0.4;text-align:center;margin-top:4px">和经纪人打好关系很重要！好感度影响通告安排</div>
  `);
}
function showTeam() {
  if (game.solo) {
    showModal('团队设置', `<div style="text-align:center;padding:8px">
      <div style="font-size:40px;margin-bottom:8px">🎤</div><div style="margin-bottom:12px">当前为Solo模式，可以组建团队</div>
      <button class="action-btn btn-primary" onclick="switchToTeam()">组建团队</button>
      <button class="action-btn btn-secondary" onclick="closeModal()">保持Solo</button>
    </div>`); return;
  }
  const body = game.members.map((m,i)=>`<div class="member-item">
    <div class="member-avatar-sm">${m.avatar}</div>
    <div class="member-info"><div class="member-name-sm">${m.name}</div><div class="member-role">${m.role} · ${m.age}岁</div></div>
    <button class="btn-small" style="background:#3a3a5a" onclick="editMember(${i})">编辑</button>
  </div>`).join('');
  showModal('团队成员', `<div style="margin-bottom:10px">${body}</div><button class="action-btn btn-secondary" onclick="closeModal()">关闭</button>`);
}
function switchToTeam() { game.solo=false; game.members=[{name:'队友A',role:'主舞',age:20,avatar:'💃'},{name:'队友B',role:'rapper',age:21,avatar:'🎧'}]; saveGame(); updateUI(); closeModal(); showTeam(); toast('团队已组建！'); }
function editMember(idx) {
  const m = game.members[idx];
  showModal('编辑成员', `<div class="form-group"><label class="form-label">姓名</label><input class="form-input" id="m-name" value="${m.name}"></div>
    <div class="form-group"><label class="form-label">定位</label><input class="form-input" id="m-role" value="${m.role}"></div>
    <div class="form-group"><label class="form-label">年龄</label><input class="form-input" id="m-age" type="number" value="${m.age}" min="15" max="40"></div>
    <button class="action-btn btn-primary" onclick="saveMember(${idx})">保存</button>`);
}
function saveMember(idx) {
  game.members[idx].name=document.getElementById('m-name').value||'队友';
  game.members[idx].role=document.getElementById('m-role').value||'成员';
  game.members[idx].age=parseInt(document.getElementById('m-age').value)||20;
  saveGame(); closeModal(); showTeam();
}
function showTeamName() { showModal('团队名称', `<div class="form-group"><label class="form-label">团队名</label><input class="form-input" id="team-name-input" value="${game.teamName}" placeholder="给你的团队起个名字"></div><button class="action-btn btn-primary" onclick="saveTeamName()">保存</button>`); }
function saveTeamName() { game.teamName=document.getElementById('team-name-input').value.trim()||''; saveGame(); closeModal(); toast('团队名已保存'); }
function showLive() {
  showModal('📺 直播', `<div style="text-align:center;padding:8px">
    <div style="font-size:40px;margin-bottom:8px">📺</div>
    <div style="font-size:12px;opacity:0.7;margin-bottom:10px">消耗8体力，随机增加粉丝</div>
    <button class="action-btn btn-primary" onclick="doLive()">开始直播</button>
  </div>`);
}
function doLive() {
  if (!game.debuted) { toast('出道后才能直播'); closeModal(); return; }
  if (game.stamina < 8) { toast('体力不足！'); closeModal(); return; }
  game.stamina -= 8;
  const fanGain = rand(1000, 10000);
  game.fans += fanGain;
  const likes = rand(200, 5000);
  addLog('直播获得' + formatNum(fanGain) + '新粉丝！');
  toast('直播结束！粉丝+' + formatNum(fanGain));
  updateUI(); saveGame(); closeModal();
}
function showBanInfo() {
  showModal('🚫 恋爱限制令', `<div style="text-align:center;padding:8px">
    <div style="font-size:40px;margin-bottom:8px">🚫</div>
    ${game.banActive ? `<div style="font-size:14px;font-weight:700;margin-bottom:6px">恋爱限制令生效中</div><div style="font-size:11px;opacity:0.6;margin-bottom:10px">限制令期间请勿公开恋爱关系<br>偷偷恋爱有被曝光的风险！</div>` : `<div style="font-size:14px;font-weight:700;color:#2ed573;margin-bottom:6px">限制令已解除</div><div style="font-size:11px;opacity:0.6">可以自由恋爱了</div>`}
    <button class="action-btn btn-secondary" onclick="closeModal()">知道了</button>
  </div>`);
}
function showGameLog() {
  const body = game.news.length ? game.news.map(n=>`<div style="padding:4px 0;font-size:11px;border-bottom:1px solid rgba(255,255,255,0.05)">${n.time} - ${n.text}</div>`).join('') : '<div style="text-align:center;padding:20px;opacity:0.4">暂无日志</div>';
  showModal('游戏日志', `<div style="max-height:400px;overflow-y:auto">${body}</div><button class="action-btn btn-secondary" onclick="closeModal()" style="margin-top:10px">关闭</button>`);
}
function resetGame() {
  showModal('确认重置', `<div style="text-align:center;padding:8px">
    <div style="font-size:40px;margin-bottom:8px">⚠️</div><div style="margin-bottom:12px;font-size:13px">确定要重新开始吗？当前进度将被清空！</div>
    <button class="action-btn btn-danger" onclick="confirmReset()">确定重置</button>
    <button class="action-btn btn-secondary" onclick="closeModal()">取消</button>
  </div>`);
}
function confirmReset() {
  localStorage.removeItem('idolCurrent');
  showInitialSetup();
  closeModal();
}

// ========== 初始设置 ==========
function showInitialSetup() {
  const moneyOpts = INITIAL_MONEY_OPTIONS.map(m => `<button class="action-btn btn-secondary" onclick="startNewGame(${m})" style="margin-bottom:6px">💰 ${formatNum(m)} 金币</button>`).join('');
  showModal('🎮 新游戏 — 选择初始资金', `<div style="text-align:center;padding:8px">
    <div style="font-size:14px;font-weight:700;margin-bottom:12px">请选择初始资金</div>
    ${moneyOpts}
  </div>`);
}
function startNewGame(initialMoney) {
  game = makeDefaultState(initialMoney);
  saveGame();
  updateUI(); renderHotList(); renderPMList(); renderWXList(); renderSMSList(); renderMyWeibos(); checkConcert();
  closeModal();
  toast('新游戏开始！祝游戏愉快！');
}

// ========== 随机事件 ==========
function generateRandomEvent() {
  const events = [
    {text:'✨ 收到神秘礼物！心情+10',effect:()=>{ game.mood=Math.min(100,game.mood+10); }},
    {text:'🌟 被前辈夸奖！声乐+3',effect:()=>{ game.vocal+=3; }},
    {text:'💃 突然想跳舞！舞蹈+3',effect:()=>{ game.dance+=3; }},
    {text:'😴 美美睡了一觉，体力恢复+50',effect:()=>{ const maxSt=game.debuted?STAMINA_MAX:TRAINEES_MAX_STAMINA; game.stamina=Math.min(maxSt,game.stamina+50); }},
    {text:'🤔 思考人生，心情-5',effect:()=>{ game.mood=Math.max(0,game.mood-5); }},
    {text:'😫 有点累，疲惫+5',effect:()=>{ game.fatigue=Math.min(100,game.fatigue+5); }},
    {text:'💰 捡到钱了！金币+500',effect:()=>{ game.money+=500; }},
    {text:'📱 收到粉丝打赏！金币+200',effect:()=>{ if(game.debuted) game.money+=200; }},
  ];
  const ev = events[rand(0,events.length-1)];
  ev.effect();
  addLog(ev.text);
  updateUI(); saveGame();
}

// ========== 工具 ==========
function rand(min, max) { return Math.floor(Math.random()*(max-min+1))+min; }

// ========== 密码锁 ==========
function initLock() { window._lockPwd = GAME_PASSWORD; }
function checkLock() {
  const val = document.getElementById('lockInput').value.trim();
  if (val === window._lockPwd) {
    document.getElementById('lockScreen').classList.add('hide');
    const saved = localStorage.getItem('idolCurrent');
    if (saved) { init(); }
    else { showInitialSetup(); }
  } else {
    document.getElementById('lockError').textContent = '密码错误，请重试';
    document.getElementById('lockInput').value = '';
    document.getElementById('lockInput').focus();
  }
}
initLock();
document.getElementById('lockInput').focus();
</script>
